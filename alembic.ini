[alembic]
# ruta a las migraciones, relativa a este archivo
script_location = alembic

# plantilla usada para nombrar los archivos de migración
# file_template = %%(rev)s_%%(slug)s

# zona horaria para los timestamps dentro de los nombres de archivo
# timezone =

# largo máximo de caracteres para el "slug" generado en el nombre del archivo
# truncate_slug_length = 40

# si se revisa el estado de git antes de generar una revisión
# revision_environment = false

# permite archivos de migración .pyc/.pyo sin su .py correspondiente
# sourceless = false

# version location specification
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# separador de rutas para version_locations
version_path_separator = os

# el sqlalchemy.url real lo inyecta app/database.py vía env.py
# (lee DATABASE_URL desde tu .env), así que esta línea puede quedar vacía
sqlalchemy.url =


[post_write_hooks]
# hooks que corren sobre un archivo de migración recién generado
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S