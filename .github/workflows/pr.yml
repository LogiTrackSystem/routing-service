# Se ejecuta en cada push a una rama que no sea main y en cada Pull Request hacia main. NO publica ni despliega nada.
# (Los push a main los atiende deploy.yml, que también ejecuta primero las pruebas.)
# El check "ci / validar" debe estar marcado como requerido en la protección de main.
name: PR

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: LogiTrackSystem/pipelines/.github/workflows/ci.yml@v1
    with:
      service-name: routing
